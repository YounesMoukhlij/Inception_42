
server
{
    listen 443 ssl;
    ssl_certificate /etc/nginx/youmoukh.crt;
    ssl_certificate_key /etc/nginx/youmoukh.key;
    ssl_protocols TLSv1.2;


    server_name localhost;
    root /var/www/html;
    index index.html index.htm;


