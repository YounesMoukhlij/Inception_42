version: "3.8"

services:
  mariadb:
    build: requirements/mariadb
    image: mariadb:0.1
    container_name: mariadb
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    env_file:
      - .env


  wordpress:
    build: requirements/wordpress
    image: wordpress:0.1
    container_name: wordpress
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - inception_network

  nginx:
    image: nginx:0.1
    build: requirements/nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
  redis:
    image: redis:0.1
    build: requirements/redis
    container_name: redis
    restart: always
    networks:
      - inception_network
    depends_on:
      - wordpress




volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/youmoukh/data/mariadb
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/youmoukh/data/wordpress
      o: bind

networks:
  inception_network:
    driver: bridge
