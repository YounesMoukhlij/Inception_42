
services:
  mariadb:
    image: mariadb:latest
    build: requirements/mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}  
      MARIADB_DATABASE: ${CONFIGURATION_DB_NAME}       
      MARIADB_USER: ${CONFIGURATION_DB_USER}          
      MARIADB_PASSWORD: ${CONFIGURATION_DB_PASSWORD}
    container_name: mariadb
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    env_file:
      - .env


  wordpress:
    image: wordpress:php8.2-apache
    build: requirements/wordpress
    container_name: wordpress
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - inception_network

  nginx:
    image: nginx:latest
    build: requirements/nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html  # Share WordPress files with NGINX
    depends_on:
      - wordpress

volumes:
  mariadb_data:
  wordpress_data:

networks:
  inception_network:
    driver: bridge
